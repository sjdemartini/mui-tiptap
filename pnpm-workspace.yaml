# This is not a multi-package workspace. Explicitly set packages to an empty
# list so that pnpm doesn't treat subdirectories (like example/) as workspace
# members, which would change dependency resolution behavior.
packages: []

autoInstallPeers: false

overrides:
  # get-uri still requires basic-ftp v5; remove once it accepts a patched release.
  # https://github.com/patrickjuchli/basic-ftp/security/advisories/GHSA-5rfr-xx34-2xxv
  'get-uri@6>basic-ftp': ^6.2.2

allowBuilds:
  '@swc/core': true
  esbuild: true
  unrs-resolver: false
